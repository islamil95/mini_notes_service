services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - notes-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: notes-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - notes-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: notes-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-notes}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-notes}
    volumes:
      - notes-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

volumes:
  notes-db-data:
